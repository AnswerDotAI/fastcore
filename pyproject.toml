[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcore"
dynamic = ["version"]
description = "Python supercharged for fastai development"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard and Sylvain Gugger", email = "infos@fast.ai"}]
keywords = ['python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/fastcore/"
Documentation = "https://fastcore.fast.ai/"

[project.entry-points.nbdev]
fastcore = "fastcore._modidx:d"

[project.entry-points.pyskills]
"fastcore" = "fastcore.skill"
"fastcore.editskill" = "fastcore.editskill"

[project.optional-dependencies]
dev = ['numpy', 'nbdev[exec]>=3.3.32', 'matplotlib', 'pillow', 'torch', 'pandas', 'nbclassic', 'plum-dispatch', 'remold']


[project.scripts]
py2pyi = "fastcore.py2pyi:py2pyi"
replace_wildcards = "fastcore.py2pyi:replace_wildcards"

[tool.setuptools.dynamic]
version = {attr = "fastcore.__version__"}

[tool.setuptools.packages.find]
include = ["fastcore"]

[tool.nbdev]
to_meta = ["export"]
allowed_metadata_keys = ['solveit']
tst_flags = ''
custom_sidebar = false
allowed_cell_metadata_keys = ['solveit_ai']

[tool.chkstyle]
skip_paths = ["_modidx.py"]

[tool.docs]
Docs = [
  "06_script.ipynb",
  "02_foundation.ipynb",
  "03c_aio.ipynb",
  "fastcore.editskill",
  "000_tour.ipynb",
]
API = "."
Resources = [
  ["fastcore: an underrated Python library", "https://gist.githubusercontent.com/hamelsmu/ea9e0519d9a94a4203bcc36043eb01c5/raw/6c0c96a2823d67aecc103206d6ab21c5dcd520a/fastcore:_an_underrated_python_library.md", "External tour of fastcore features"],
]
