[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcore"
dynamic = ["version"]
description = "Python supercharged for fastai development"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard and Sylvain Gugger", email = "infos@fast.ai"}]
keywords = ['python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/fastcore/"
Documentation = "https://fastcore.fast.ai/"

[project.entry-points.nbdev]
fastcore = "fastcore._modidx:d"

[project.entry-points.pyskills]
"fastcore" = "fastcore.skill"
"fastcore.editskill" = "fastcore.editskill"

[project.optional-dependencies]
dev = ['numpy', 'nbdev>=3.3.32', 'matplotlib', 'pillow', 'torch', 'pandas', 'nbclassic', 'pysym2md>=0.0.6', 'plum-dispatch', 'remold']


[project.scripts]
py2pyi = "fastcore.py2pyi:py2pyi"
replace_wildcards = "fastcore.py2pyi:replace_wildcards"

[tool.setuptools.dynamic]
version = {attr = "fastcore.__version__"}

[tool.setuptools.packages.find]
include = ["fastcore"]

[tool.nbdev]
to_meta = ["export"]
allowed_metadata_keys = ['solveit']
tst_flags = ''
custom_sidebar = false
allowed_cell_metadata_keys = ['solveit_ai']
pre_docs = ["pysym2md --output-file apilist.txt fastcore"]

[tool.chkstyle]
skip_paths = ["_modidx.py"]
